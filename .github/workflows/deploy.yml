name: Deploy wp-content to Cloudways

on:
    push:
        branches: ["staging", "main"]
    workflow_dispatch:
        inputs:
            target:
                description: "Where to deploy"
                required: true
                type: choice
                options: ["staging", "production"]

jobs:
    deploy:
        runs-on: ubuntu-latest

        # Resolve target env from branch or manual input
        env:
            TARGET: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || inputs.target }}

        steps:
            - name: Check out repo
              uses: actions/checkout@v4

            # Build tracked-files-only artifact, then copy it into the workspace so SCP can see it
            - name: Build artifact (tracked files only)
              run: |
                  NAME="wp-content-${GITHUB_SHA}.tar.gz"
                  ART="$RUNNER_TEMP/$NAME"
                  git archive --format=tar.gz -o "$ART" HEAD
                  cp "$ART" "$GITHUB_WORKSPACE/$NAME"
                  echo "ARTIFACT_NAME=$NAME" >> $GITHUB_ENV

            # -------------------------
            # STAGING
            # -------------------------
            - name: Ensure remote dirs (STAGING)
              if: env.TARGET == 'staging'
              uses: appleboy/ssh-action@v1.1.0
              with:
                  host: ${{ secrets.STAGING_HOST }}
                  username: ${{ secrets.STAGING_USER }}
                  key: ${{ secrets.STAGING_SSH_KEY }}
                  script: |
                      mkdir -p "$HOME/deploy" "$HOME/releases" "$HOME/backups"

            - name: Upload tarball to STAGING
              if: env.TARGET == 'staging'
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.STAGING_HOST }}
                  username: ${{ secrets.STAGING_USER }}
                  key: ${{ secrets.STAGING_SSH_KEY }}
                  source: "${{ env.ARTIFACT_NAME }}" # file is now in /github/workspace
                  target: "~/deploy"

            - name: Release on STAGING (backup + deploy)
              if: env.TARGET == 'staging'
              uses: appleboy/ssh-action@v1.1.0
              with:
                  host: ${{ secrets.STAGING_HOST }}
                  username: ${{ secrets.STAGING_USER }}
                  key: ${{ secrets.STAGING_SSH_KEY }}
                  script: |
                      set -e
                      APP_WP_CONTENT="${{ secrets.STAGING_PATH }}"
                      TARBALL="$HOME/deploy/wp-content-${GITHUB_SHA}.tar.gz"
                      RELEASE_DIR="$HOME/releases/wp-content-${GITHUB_SHA}"

                      # Backup current wp-content (excluding uploads)
                      tar -czf "$HOME/backups/wp-content-$(date +%F-%H%M)-${GITHUB_SHA}.tgz" \
                        -C "$APP_WP_CONTENT" --exclude='uploads' .

                      # Prepare release
                      mkdir -p "$RELEASE_DIR"
                      tar -xzf "$TARBALL" -C "$RELEASE_DIR"

                      # Deploy (preserve uploads)
                      if command -v rsync >/dev/null 2>&1; then
                        rsync -a --delete --exclude 'uploads' "$RELEASE_DIR"/ "$APP_WP_CONTENT"/
                      else
                        shopt -s dotglob
                        find "$APP_WP_CONTENT" -mindepth 1 -maxdepth 1 ! -name 'uploads' -exec rm -rf {} +
                        cp -a "$RELEASE_DIR"/. "$APP_WP_CONTENT"/
                      fi

                      # Optional: WP-CLI cache & Elementor CSS flush
                      if command -v wp >/dev/null 2>&1; then
                        cd "$APP_WP_CONTENT/.."
                        wp cache flush || true
                        wp elementor flush_css || true
                      fi

                      # Safe perms
                      find "$APP_WP_CONTENT" -type d -exec chmod 755 {} \;
                      find "$APP_WP_CONTENT" -type f -exec chmod 644 {} \;

            # -------------------------
            # PRODUCTION
            # -------------------------
            - name: Ensure remote dirs (PRODUCTION)
              if: env.TARGET == 'production'
              uses: appleboy/ssh-action@v1.1.0
              with:
                  host: ${{ secrets.PROD_HOST }}
                  username: ${{ secrets.PROD_USER }}
                  key: ${{ secrets.PROD_SSH_KEY }}
                  script: |
                      mkdir -p "$HOME/deploy" "$HOME/releases" "$HOME/backups"

            - name: Upload tarball to PRODUCTION
              if: env.TARGET == 'production'
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.PROD_HOST }}
                  username: ${{ secrets.PROD_USER }}
                  key: ${{ secrets.PROD_SSH_KEY }}
                  source: "${{ env.ARTIFACT_NAME }}" # file is now in /github/workspace
                  target: "~/deploy"

            - name: Release on PRODUCTION (backup + deploy)
              if: env.TARGET == 'production'
              uses: appleboy/ssh-action@v1.1.0
              with:
                  host: ${{ secrets.PROD_HOST }}
                  username: ${{ secrets.PROD_USER }}
                  key: ${{ secrets.PROD_SSH_KEY }}
                  script: |
                      set -e
                      APP_WP_CONTENT="${{ secrets.PROD_PATH }}"
                      TARBALL="$HOME/deploy/wp-content-${GITHUB_SHA}.tar.gz"
                      RELEASE_DIR="$HOME/releases/wp-content-${GITHUB_SHA}"

                      tar -czf "$HOME/backups/wp-content-$(date +%F-%H%M)-${GITHUB_SHA}.tgz" \
                        -C "$APP_WP_CONTENT" --exclude='uploads' .

                      mkdir -p "$RELEASE_DIR"
                      tar -xzf "$TARBALL" -C "$RELEASE_DIR"

                      if command -v rsync >/dev/null 2>&1; then
                        rsync -a --delete --exclude 'uploads' "$RELEASE_DIR"/ "$APP_WP_CONTENT"/
                      else
                        shopt -s dotglob
                        find "$APP_WP_CONTENT" -mindepth 1 -maxdepth 1 ! -name 'uploads' -exec rm -rf {} +
                        cp -a "$RELEASE_DIR"/. "$APP_WP_CONTENT"/
                      fi

                      if command -v wp >/dev/null 2>&1; then
                        cd "$APP_WP_CONTENT/.."
                        wp cache flush || true
                        wp elementor flush_css || true
                      fi

                      find "$APP_WP_CONTENT" -type d -exec chmod 755 {} \;
                      find "$APP_WP_CONTENT" -type f -exec chmod 644 {} \;
