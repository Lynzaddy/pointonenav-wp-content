name: Deploy wp-content (Safe WordPress Deploy)

on:
  push:
    branches:
      - staging
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy themes and custom plugins safely
        env:
          HOST: ${{ github.ref_name == 'main' && secrets.PROD_HOST || secrets.STAGING_HOST }}
          USER: ${{ github.ref_name == 'main' && secrets.PROD_USER || secrets.STAGING_USER }}
          KEY:  ${{ github.ref_name == 'main' && secrets.PROD_SSH_KEY || secrets.STAGING_SSH_KEY }}
        run: |
          printf "%s" "$KEY" > id_rsa
          chmod 600 id_rsa

          RSYNC_SSH="ssh -i id_rsa -o StrictHostKeyChecking=no"

          echo "Deploying to $HOST"

          # -------------------------------------------------
          # Deploy THEMES (mirror safely)
          # -------------------------------------------------
          echo "Syncing themes..."
          rsync -az --delete \
            -e "$RSYNC_SSH" \
            themes/ \
            "$USER@$HOST:public_html/wp-content/themes/"

          # -------------------------------------------------
          # Deploy CUSTOM PLUGINS ONLY
          # -------------------------------------------------
          echo "Syncing pointone-card-carousel..."
          rsync -az --delete \
            -e "$RSYNC_SSH" \
            plugins/pointone-card-carousel/ \
            "$USER@$HOST:public_html/wp-content/plugins/pointone-card-carousel/"

          echo "Syncing pointone-site-alert-bar..."
          rsync -az --delete \
            -e "$RSYNC_SSH" \
            plugins/pointone-site-alert-bar/ \
            "$USER@$HOST:public_html/wp-content/plugins/pointone-site-alert-bar/"

          echo "Syncing pointone-site-events..."
          rsync -az --delete \
            -e "$RSYNC_SSH" \
            plugins/pointone-events/ \
            "$USER@$HOST:public_html/wp-content/plugins/pointone-events/"     

          echo "Syncing pointone-global-variables..."
          rsync -az --delete \
            -e "$RSYNC_SSH" \
            plugins/pointone-global-variables/ \
            "$USER@$HOST:public_html/wp-content/plugins/pointone-global-variables/"             

          echo "Deployment complete."
