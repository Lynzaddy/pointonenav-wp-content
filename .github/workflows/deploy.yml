name: Deploy wp-content (rsync)

on:
  push:
    branches: ["staging", "main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via rsync over SSH
        env:
          HOST: ${{ github.ref_name == 'main' && secrets.PROD_HOST || secrets.STAGING_HOST }}
          USER: ${{ github.ref_name == 'main' && secrets.PROD_USER || secrets.STAGING_USER }}
          KEY:  ${{ github.ref_name == 'main' && secrets.PROD_SSH_KEY || secrets.STAGING_SSH_KEY }}
        run: |
          printf "%s" "$KEY" > id_rsa
          chmod 600 id_rsa

          RSYNC_SSH="ssh -i id_rsa -o StrictHostKeyChecking=no"

          rsync -az --delete \
            --exclude ".git" \
            -e "$RSYNC_SSH" \
            ./ \
            "$USER@$HOST:public_html/wp-content/"
