name: Deploy wp-content to Cloudways

on:
    push:
        branches: ["staging", "main"]
    workflow_dispatch:
        inputs:
            target:
                description: "Where to deploy"
                required: true
                type: choice
                options: ["staging", "production"]

jobs:
    deploy:
        runs-on: ubuntu-latest

        env:
            TARGET: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || inputs.target }}

        steps:
            - name: Check out repo
              uses: actions/checkout@v4

            - name: Build artifact (tracked files only)
              run: |
                  NAME="wp-content-${GITHUB_SHA}.tar.gz"
                  ART="$RUNNER_TEMP/$NAME"
                  git archive --format=tar.gz -o "$ART" HEAD
                  cp "$ART" "$GITHUB_WORKSPACE/$NAME"
                  echo "ARTIFACT_NAME=$NAME" >> $GITHUB_ENV

# ==================================================
# =================== STAGING ======================
# ==================================================

            - name: Ensure remote dirs (STAGING)
              if: env.TARGET == 'staging'
              uses: appleboy/ssh-action@v1.1.0
              with:
                  host: ${{ secrets.STAGING_HOST }}
                  username: ${{ secrets.STAGING_USER }}
                  key: ${{ secrets.STAGING_SSH_KEY }}
                  script: |
                      set -e
                      APP_WP_CONTENT="${{ secrets.STAGING_PATH }}"
                      APP_ROOT="$(dirname "$APP_WP_CONTENT")"
                      DEPLOY_BASE="$APP_ROOT/.deploy"
                      mkdir -p "$DEPLOY_BASE/deploy" "$DEPLOY_BASE/releases" "$DEPLOY_BASE/backups"

            - name: Upload artifact with rsync (STAGING)
              if: env.TARGET == 'staging'
              env:
                  STAGING_HOST: ${{ secrets.STAGING_HOST }}
                  STAGING_USER: ${{ secrets.STAGING_USER }}
                  STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
              run: |
                  printf "%s" "$STAGING_SSH_KEY" > "$GITHUB_WORKSPACE/id_staging"
                  chmod 600 "$GITHUB_WORKSPACE/id_staging"
                  RSYNC_SSH="ssh -i $GITHUB_WORKSPACE/id_staging -o StrictHostKeyChecking=no"
                  rsync -avz -e "$RSYNC_SSH" "$ARTIFACT_NAME" \
                    "${STAGING_USER}@${STAGING_HOST}:public_html/.deploy/deploy/$ARTIFACT_NAME"

            - name: Release on STAGING (backup + deploy)
              if: env.TARGET == 'staging'
              uses: appleboy/ssh-action@v1.1.0
              with:
                  host: ${{ secrets.STAGING_HOST }}
                  username: ${{ secrets.STAGING_USER }}
                  key: ${{ secrets.STAGING_SSH_KEY }}
                  script: |
                      set -euo pipefail
                      APP_WP_CONTENT="${{ secrets.STAGING_PATH }}"
                      APP_ROOT="$(dirname "$APP_WP_CONTENT")"
                      DEPLOY_BASE="$APP_ROOT/.deploy"

                      TARBALL="$(ls -1t "$DEPLOY_BASE/deploy"/wp-content-*.tar.gz | head -n1)"
                      NAME="$(basename "$TARBALL" .tar.gz)"
                      RELEASE_DIR="$DEPLOY_BASE/releases/$NAME"

                      tar -czf "$DEPLOY_BASE/backups/${NAME}-backup-$(date +%F-%H%M).tgz" \
                        -C "$APP_WP_CONTENT" --exclude='uploads' .

                      mkdir -p "$RELEASE_DIR"
                      tar -xzf "$TARBALL" -C "$RELEASE_DIR"

                      if [ -d "$RELEASE_DIR/plugins" ]; then
                        SRC_BASE="$RELEASE_DIR"
                        SRC_PLUGINS_DIR="$RELEASE_DIR/plugins"
                      else
                        SRC_BASE="$RELEASE_DIR/wp-content"
                        SRC_PLUGINS_DIR="$RELEASE_DIR/wp-content/plugins"
                      fi

                      # Sync wp-content except uploads + plugins
                      rsync -rltD \
                        --exclude 'uploads' \
                        --exclude 'uploads/**' \
                        --exclude 'plugins' \
                        --exclude 'plugins/**' \
                        --no-perms --no-owner --no-group \
                        --omit-dir-times --no-times \
                        --chmod=Du=rwx,Fu=rw \
                        "$SRC_BASE"/ "$APP_WP_CONTENT"/

                      # Deploy pointone-card-carousel
                      if [ -d "$SRC_PLUGINS_DIR/pointone-card-carousel" ]; then
                        rsync -rltD \
                          --no-perms --no-owner --no-group \
                          --omit-dir-times --no-times \
                          --chmod=Du=rwx,Fu=rw \
                          "$SRC_PLUGINS_DIR/pointone-card-carousel/" \
                          "$APP_WP_CONTENT/plugins/pointone-card-carousel/"
                      fi

                      # Deploy pointone-site-alert-bar
                      if [ -d "$SRC_PLUGINS_DIR/pointone-site-alert-bar" ]; then
                        rsync -rltD \
                          --no-perms --no-owner --no-group \
                          --omit-dir-times --no-times \
                          --chmod=Du=rwx,Fu=rw \
                          "$SRC_PLUGINS_DIR/pointone-site-alert-bar/" \
                          "$APP_WP_CONTENT/plugins/pointone-site-alert-bar/"
                      fi

                      if command -v wp >/dev/null 2>&1; then
                        cd "$APP_ROOT"
                        wp --skip-plugins --skip-themes cache flush || true
                        wp --skip-themes elementor flush_css || true
                      fi

                      find "$APP_WP_CONTENT" -type d -exec chmod 755 {} \;
                      find "$APP_WP_CONTENT" -type f -exec chmod 644 {} \;

# ==================================================
# ================= PRODUCTION =====================
# ==================================================

            - name: Ensure remote dirs (PRODUCTION)
              if: env.TARGET == 'production'
              uses: appleboy/ssh-action@v1.1.0
              with:
                  host: ${{ secrets.PROD_HOST }}
                  username: ${{ secrets.PROD_USER }}
                  key: ${{ secrets.PROD_SSH_KEY }}
                  script: |
                      set -e
                      APP_WP_CONTENT="${{ secrets.PROD_PATH }}"
                      APP_ROOT="$(dirname "$APP_WP_CONTENT")"
                      DEPLOY_BASE="$APP_ROOT/.deploy"
                      mkdir -p "$DEPLOY_BASE/deploy" "$DEPLOY_BASE/releases" "$DEPLOY_BASE/backups"

            - name: Upload artifact with rsync (PRODUCTION)
              if: env.TARGET == 'production'
              env:
                  PROD_HOST: ${{ secrets.PROD_HOST }}
                  PROD_USER: ${{ secrets.PROD_USER }}
                  PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
              run: |
                  printf "%s" "$PROD_SSH_KEY" > "$GITHUB_WORKSPACE/id_prod"
                  chmod 600 "$GITHUB_WORKSPACE/id_prod"
                  RSYNC_SSH="ssh -i $GITHUB_WORKSPACE/id_prod -o StrictHostKeyChecking=no"
                  rsync -avz -e "$RSYNC_SSH" "$ARTIFACT_NAME" \
                    "${PROD_USER}@${PROD_HOST}:public_html/.deploy/deploy/$ARTIFACT_NAME"

            - name: Release on PRODUCTION (backup + deploy)
              if: env.TARGET == 'production'
              uses: appleboy/ssh-action@v1.1.0
              with:
                  host: ${{ secrets.PROD_HOST }}
                  username: ${{ secrets.PROD_USER }}
                  key: ${{ secrets.PROD_SSH_KEY }}
                  script: |
                      set -euo pipefail
                      APP_WP_CONTENT="${{ secrets.PROD_PATH }}"
                      APP_ROOT="$(dirname "$APP_WP_CONTENT")"
                      DEPLOY_BASE="$APP_ROOT/.deploy"

                      TARBALL="$(ls -1t "$DEPLOY_BASE/deploy"/wp-content-*.tar.gz | head -n1)"
                      NAME="$(basename "$TARBALL" .tar.gz)"
                      RELEASE_DIR="$DEPLOY_BASE/releases/$NAME"

                      tar -czf "$DEPLOY_BASE/backups/${NAME}-backup-$(date +%F-%H%M).tgz" \
                        -C "$APP_WP_CONTENT" --exclude='uploads' .

                      mkdir -p "$RELEASE_DIR"
                      tar -xzf "$TARBALL" -C "$RELEASE_DIR"

                      if [ -d "$RELEASE_DIR/plugins" ]; then
                        SRC_BASE="$RELEASE_DIR"
                        SRC_PLUGINS_DIR="$RELEASE_DIR/plugins"
                      else
                        SRC_BASE="$RELEASE_DIR/wp-content"
                        SRC_PLUGINS_DIR="$RELEASE_DIR/wp-content/plugins"
                      fi

                      rsync -rltD \
                        --exclude 'uploads' \
                        --exclude 'uploads/**' \
                        --exclude 'plugins' \
                        --exclude 'plugins/**' \
                        --no-perms --no-owner --no-group \
                        --omit-dir-times --no-times \
                        --chmod=Du=rwx,Fu=rw \
                        "$SRC_BASE"/ "$APP_WP_CONTENT"/

                      if [ -d "$SRC_PLUGINS_DIR/pointone-card-carousel" ]; then
                        rsync -rltD \
                          --no-perms --no-owner --no-group \
                          --omit-dir-times --no-times \
                          --chmod=Du=rwx,Fu=rw \
                          "$SRC_PLUGINS_DIR/pointone-card-carousel/" \
                          "$APP_WP_CONTENT/plugins/pointone-card-carousel/"
                      fi

                      if [ -d "$SRC_PLUGINS_DIR/pointone-site-alert-bar" ]; then
                        rsync -rltD \
                          --no-perms --no-owner --no-group \
                          --omit-dir-times --no-times \
                          --chmod=Du=rwx,Fu=rw \
                          "$SRC_PLUGINS_DIR/pointone-site-alert-bar/" \
                          "$APP_WP_CONTENT/plugins/pointone-site-alert-bar/"
                      fi

                      if command -v wp >/dev/null 2>&1; then
                        cd "$APP_ROOT"
                        wp --skip-plugins --skip-themes cache flush || true
                        wp --skip-themes elementor flush_css || true
                      fi

                      find "$APP_WP_CONTENT" -type d -exec chmod 755 {} \;
                      find "$APP_WP_CONTENT" -type f -exec chmod 644 {} \;
