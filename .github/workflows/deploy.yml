name: Debug Deploy

on:
  push:
    branches: ["staging"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show current commit
        run: |
          echo "Current SHA: $GITHUB_SHA"
          git log -1 --name-only

      - name: Build artifact
        run: |
          NAME="wp-content-${GITHUB_SHA}.tar.gz"
          git archive --format=tar.gz -o "$NAME" HEAD
          echo "ARTIFACT_NAME=$NAME" >> $GITHUB_ENV
          echo "Checking if foo.css exists in artifact:"
          tar -tzf "$NAME" | grep foo || echo "foo.css NOT FOUND in artifact"

      - name: Upload artifact to STAGING
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "${{ env.ARTIFACT_NAME }}"
          target: "public_html/"

      - name: Extract on STAGING
        uses: appleboy/ssh-action@v1.1.0
        env:
          ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e

            echo "Listing uploaded tarball:"
            ls -lah public_html/${ARTIFACT_NAME}

            echo "Checking if foo.css exists inside tarball:"
            tar -tzf public_html/${ARTIFACT_NAME} | grep foo || echo "foo.css NOT FOUND in remote tarball"

            echo "Extracting directly into wp-content..."
            tar -xzf public_html/${ARTIFACT_NAME} -C public_html/

            echo "Checking if foo.css now exists on server:"
            ls -lah public_html/wp-content/themes/hello-elementor-child/css/ || true
