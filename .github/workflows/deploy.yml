name: Deploy wp-content to Cloudways

on:
    push:
        branches: ["staging", "main"]
    workflow_dispatch:
        inputs:
            target:
                description: "Where to deploy"
                required: true
                type: choice
                options: ["staging", "production"]

jobs:
    deploy:
        runs-on: ubuntu-latest

        env:
            TARGET: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || inputs.target }}

        steps:
            - name: Check out repo
              uses: actions/checkout@v4

            # Build tracked-files-only artifact, copy into workspace (so SCP container can see it)
            - name: Build artifact (tracked files only)
              run: |
                  NAME="wp-content-${GITHUB_SHA}.tar.gz"
                  ART="$RUNNER_TEMP/$NAME"
                  git archive --format=tar.gz -o "$ART" HEAD
                  cp "$ART" "$GITHUB_WORKSPACE/$NAME"
                  echo "ARTIFACT_NAME=$NAME" >> $GITHUB_ENV

            # =======================
            # STAGING
            # =======================
            - name: Prepare SSH key (STAGING)
              if: env.TARGET == 'staging'
              run: |
                  # Write key into the workspace (host path) ...
                  echo "${{ secrets.STAGING_SSH_KEY }}" > "$GITHUB_WORKSPACE/id_staging"
                  chmod 600 "$GITHUB_WORKSPACE/id_staging"
                  # ... but expose the container path for actions that run in Docker
                  echo "SSH_KEY_PATH_STAGING=/github/workspace/id_staging" >> $GITHUB_ENV

            - name: Ensure remote dirs (STAGING)
              if: env.TARGET == 'staging'
              uses: appleboy/ssh-action@v1.1.0
              with:
                  host: ${{ secrets.STAGING_HOST }}
                  username: ${{ secrets.STAGING_USER }}
                  key_path: ${{ env.SSH_KEY_PATH_STAGING }}
                  script: |
                      set -e
                      APP_WP_CONTENT="${{ secrets.STAGING_PATH }}"          # $HOME/public_html/wp-content
                      APP_ROOT="$(dirname "$APP_WP_CONTENT")"               # $HOME/public_html
                      DEPLOY_BASE="$APP_ROOT/.deploy"                       # $HOME/public_html/.deploy
                      mkdir -p "$DEPLOY_BASE/deploy" "$DEPLOY_BASE/releases" "$DEPLOY_BASE/backups"
                      id -u && id -g
                      ls -ld "$APP_ROOT" "$DEPLOY_BASE" "$DEPLOY_BASE/deploy"
                      test -w "$DEPLOY_BASE/deploy"
                      if [ ! -f "$DEPLOY_BASE/.htaccess" ]; then
                        printf "%s\n" "Require all denied" > "$DEPLOY_BASE/.htaccess" || true
                      fi

            - name: Upload tarball to STAGING
              if: env.TARGET == 'staging'
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.STAGING_HOST }}
                  username: ${{ secrets.STAGING_USER }}
                  key_path: ${{ env.SSH_KEY_PATH_STAGING }}
                  source: "${{ env.ARTIFACT_NAME }}" # in /github/workspace
                  target: "public_html/.deploy/deploy" # -> $HOME/public_html/.deploy/deploy
                  overwrite: true
                  debug: true

            - name: Verify upload on STAGING
              if: env.TARGET == 'staging'
              uses: appleboy/ssh-action@v1.1.0
              with:
                  host: ${{ secrets.STAGING_HOST }}
                  username: ${{ secrets.STAGING_USER }}
                  key_path: ${{ env.SSH_KEY_PATH_STAGING }}
                  script: |
                      set -e
                      APP_WP_CONTENT="${{ secrets.STAGING_PATH }}"
                      APP_ROOT="$(dirname "$APP_WP_CONTENT")"
                      DEPLOY_BASE="$APP_ROOT/.deploy"
                      echo ":: info :: Files in deploy dir:"
                      ls -lah "$DEPLOY_BASE/deploy"

            - name: Release on STAGING (backup + deploy)
              if: env.TARGET == 'staging'
              uses: appleboy/ssh-action@v1.1.0
              with:
                  host: ${{ secrets.STAGING_HOST }}
                  username: ${{ secrets.STAGING_USER }}
                  key_path: ${{ env.SSH_KEY_PATH_STAGING }}
                  script: |
                      set -e
                      APP_WP_CONTENT="${{ secrets.STAGING_PATH }}"
                      APP_ROOT="$(dirname "$APP_WP_CONTENT")"
                      DEPLOY_BASE="$APP_ROOT/.deploy"
                      if [ -f "$DEPLOY_BASE/deploy/wp-content-${GITHUB_SHA}.tar.gz" ]; then
                        TARBALL="$DEPLOY_BASE/deploy/wp-content-${GITHUB_SHA}.tar.gz"
                      else
                        TARBALL="$(ls -1t "$DEPLOY_BASE/deploy"/*.tar.gz | head -n1)"
                      fi
                      RELEASE_DIR="$DEPLOY_BASE/releases/wp-content-${GITHUB_SHA}"

                      echo ":: info :: Using tarball: $TARBALL"

                      tar -czf "$DEPLOY_BASE/backups/wp-content-$(date +%F-%H%M)-${GITHUB_SHA}.tgz" \
                        -C "$APP_WP_CONTENT" --exclude='uploads' .

                      mkdir -p "$RELEASE_DIR"
                      tar -xzf "$TARBALL" -C "$RELEASE_DIR"

                      if command -v rsync >/div/null 2>&1; then
                        rsync -a --delete --exclude 'uploads' "$RELEASE_DIR"/ "$APP_WP_CONTENT"/
                      else
                        shopt -s dotglob
                        find "$APP_WP_CONTENT" -mindepth 1 -maxdepth 1 ! -name 'uploads' -exec rm -rf {} +
                        cp -a "$RELEASE_DIR"/. "$APP_WP_CONTENT"/
                      fi

                      if command -v wp >/dev/null 2>&1; then
                        cd "$APP_WP_CONTENT/.."
                        wp cache flush || true
                        wp elementor flush_css || true
                      fi

                      find "$APP_WP_CONTENT" -type d -exec chmod 755 {} \;
                      find "$APP_WP_CONTENT" -type f -exec chmod 644 {} \;

            # =======================
            # PRODUCTION
            # =======================
            - name: Prepare SSH key (PRODUCTION)
              if: env.TARGET == 'production'
              run: |
                  echo "${{ secrets.PROD_SSH_KEY }}" > "$GITHUB_WORKSPACE/id_prod"
                  chmod 600 "$GITHUB_WORKSPACE/id_prod"
                  echo "SSH_KEY_PATH_PROD=/github/workspace/id_prod" >> $GITHUB_ENV

            - name: Ensure remote dirs (PRODUCTION)
              if: env.TARGET == 'production'
              uses: appleboy/ssh-action@v1.1.0
              with:
                  host: ${{ secrets.PROD_HOST }}
                  username: ${{ secrets.PROD_USER }}
                  key_path: ${{ env.SSH_KEY_PATH_PROD }}
                  script: |
                      set -e
                      APP_WP_CONTENT="${{ secrets.PROD_PATH }}"
                      APP_ROOT="$(dirname "$APP_WP_CONTENT")"
                      DEPLOY_BASE="$APP_ROOT/.deploy"
                      mkdir -p "$DEPLOY_BASE/deploy" "$DEPLOY_BASE/releases" "$DEPLOY_BASE/backups"
                      ls -ld "$APP_ROOT" "$DEPLOY_BASE" "$DEPLOY_BASE/deploy"
                      test -w "$DEPLOY_BASE/deploy"
                      if [ ! -f "$DEPLOY_BASE/.htaccess" ]; then
                        printf "%s\n" "Require all denied" > "$DEPLOY_BASE/.htaccess" || true
                      fi

            - name: Upload tarball to PRODUCTION
              if: env.TARGET == 'production'
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.PROD_HOST }}
                  username: ${{ secrets.PROD_USER }}
                  key_path: ${{ env.SSH_KEY_PATH_PROD }}
                  source: "${{ env.ARTIFACT_NAME }}"
                  target: "public_html/.deploy/deploy"
                  overwrite: true
                  debug: true

            - name: Verify upload on PRODUCTION
              if: env.TARGET == 'production'
              uses: appleboy/ssh-action@v1.1.0
              with:
                  host: ${{ secrets.PROD_HOST }}
                  username: ${{ secrets.PROD_USER }}
                  key_path: ${{ env.SSH_KEY_PATH_PROD }}
                  script: |
                      set -e
                      APP_WP_CONTENT="${{ secrets.PROD_PATH }}"
                      APP_ROOT="$(dirname "$APP_WP_CONTENT")"
                      DEPLOY_BASE="$APP_ROOT/.deploy"
                      ls -lah "$DEPLOY_BASE/deploy"

            - name: Release on PRODUCTION (backup + deploy)
              if: env.TARGET == 'production'
              uses: appleboy/ssh-action@v1.1.0
              with:
                  host: ${{ secrets.PROD_HOST }}
                  username: ${{ secrets.PROD_USER }}
                  key_path: ${{ env.SSH_KEY_PATH_PROD }}
                  script: |
                      set -e
                      APP_WP_CONTENT="${{ secrets.PROD_PATH }}"
                      APP_ROOT="$(dirname "$APP_WP_CONTENT")"
                      DEPLOY_BASE="$APP_ROOT/.deploy"
                      if [ -f "$DEPLOY_BASE/deploy/wp-content-${GITHUB_SHA}.tar.gz" ]; then
                        TARBALL="$DEPLOY_BASE/deploy/wp-content-${GITHUB_SHA}.tar.gz"
                      else
                        TARBALL="$(ls -1t "$DEPLOY_BASE/deploy"/*.tar.gz | head -n1)"
                      fi
                      RELEASE_DIR="$DEPLOY_BASE/releases/wp-content-${GITHUB_SHA}"

                      echo ":: info :: Using tarball: $TARBALL"

                      tar -czf "$DEPLOY_BASE/backups/wp-content-$(date +%F-%H%M)-${GITHUB_SHA}.tgz" \
                        -C "$APP_WP_CONTENT" --exclude='uploads' .

                      mkdir -p "$RELEASE_DIR"
                      tar -xzf "$TARBALL" -C "$RELEASE_DIR"

                      if command -v rsync >/dev/null 2>&1; then
                        rsync -a --delete --exclude 'uploads' "$RELEASE_DIR"/ "$APP_WP_CONTENT"/
                      else
                        shopt -s dotglob
                        find "$APP_WP_CONTENT" -mindepth 1 -maxdepth 1 ! -name 'uploads' -exec rm -rf {} +
                        cp -a "$RELEASE_DIR"/. "$APP_WP_CONTENT"/
                      fi

                      if command -v wp >/dev/null 2>&1; then
                        cd "$APP_WP_CONTENT/.."
                        wp cache flush || true
                        wp elementor flush_css || true
                      fi

                      find "$APP_WP_CONTENT" -type d -exec chmod 755 {} \;
                      find "$APP_WP_CONTENT" -type f -exec chmod 644 {} \;
