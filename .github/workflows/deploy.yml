name: Deploy wp-content to Cloudways

on:
  push:
    branches: ["staging", "main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      TARGET: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build artifact
        run: |
          NAME="wp-content-${GITHUB_SHA}.tar.gz"
          git archive --format=tar.gz -o "$NAME" HEAD
          echo "ARTIFACT_NAME=$NAME" >> $GITHUB_ENV

# ================= STAGING =================

      - name: Deploy to STAGING
        if: env.TARGET == 'staging'
        uses: appleboy/ssh-action@v1.1.0
        env:
          ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e

            APP_WP_CONTENT="${{ secrets.STAGING_PATH }}"
            APP_ROOT="$(dirname "$APP_WP_CONTENT")"
            DEPLOY_BASE="$APP_ROOT/.deploy"

            mkdir -p "$DEPLOY_BASE/deploy"
            mkdir -p "$DEPLOY_BASE/releases"
            mkdir -p "$DEPLOY_BASE/backups"

            echo "Uploading artifact..."
            exit 0
