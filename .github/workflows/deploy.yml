name: Simple Deploy wp-content

on:
  push:
    branches: ["staging", "main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build artifact
        run: |
          NAME="wp-content-${GITHUB_SHA}.tar.gz"
          git archive --format=tar.gz -o "$NAME" HEAD
          echo "ARTIFACT_NAME=$NAME" >> $GITHUB_ENV
          echo "Built artifact: $NAME"
          tar -tzf "$NAME" | grep foo || true

      - name: Upload artifact
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ github.ref_name == 'main' && secrets.PROD_HOST || secrets.STAGING_HOST }}
          username: ${{ github.ref_name == 'main' && secrets.PROD_USER || secrets.STAGING_USER }}
          key: ${{ github.ref_name == 'main' && secrets.PROD_SSH_KEY || secrets.STAGING_SSH_KEY }}
          source: "${{ env.ARTIFACT_NAME }}"
          target: "public_html/"

      - name: Extract and deploy
        uses: appleboy/ssh-action@v1.1.0
        env:
          ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}
        with:
          host: ${{ github.ref_name == 'main' && secrets.PROD_HOST || secrets.STAGING_HOST }}
          username: ${{ github.ref_name == 'main' && secrets.PROD_USER || secrets.STAGING_USER }}
          key: ${{ github.ref_name == 'main' && secrets.PROD_SSH_KEY || secrets.STAGING_SSH_KEY }}
          script: |
            set -e

            echo "Extracting $ARTIFACT_NAME into public_html..."
            tar -xzf public_html/$ARTIFACT_NAME -C public_html/

            echo "Verifying foo.css exists..."
            ls -lah public_html/wp-content/themes/hello-elementor-child/css/ || true

            echo "Deploy complete."
