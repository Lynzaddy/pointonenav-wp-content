<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet" />
        <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js"></script>

        <style>
            #map-container {
                position: relative;
                width: 100%;
                height: 600px;
            }
            #map {
                position: absolute;
                top: 0;
                bottom: 0;
                width: 100%;
                border-radius: 4px;
            }

            #menu {
                position: absolute;
                background: #fff;
                padding: 10px;
                font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
                top: 10px;
                right: 10px; /* Upper Right Corner */
                border-radius: 3px;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
                z-index: 1;
            }

            .toggle-wrapper {
                display: flex;
                align-items: center;
                cursor: pointer;
                font-size: 13px;
                color: #404040;
            }
            .toggle-wrapper input {
                margin-right: 8px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div id="map-container">
            <div id="menu">
                <label class="toggle-wrapper">
                    <input id="layer-toggle" type="checkbox" />
                    Base Station
                </label>
            </div>
            <div id="map"></div>
        </div>

        <script>
            mapboxgl.accessToken = "pk.eyJ1IjoicG9pbnRvbmVuYXYiLCJhIjoiY2oyMHVneWlnMDN6ZDMybzUwdjhwaWtkeiJ9.RPwllkyS6dnuExrV3HSlIQ";

            const map = new mapboxgl.Map({
                container: "map",
                style: "mapbox://styles/pointonenav/cmj1sqj72009f01slgo6503j2",
                center: [-90.16, 49.95],
                zoom: 2.85,
                scrollZoom: false,
            });

            map.on("load", () => {
                // --- DIAGNOSTIC: FIND THE REAL ID ---
                const layers = map.getStyle().layers;

                // Filter for any layer that looks like "station"
                const candidates = layers.filter((l) => l.id.toLowerCase().includes("station"));

                // 1. DUMP ALL IDs to the Browser Console (F12) just in case
                console.log(
                    "ALL LAYERS:",
                    layers.map((l) => l.id)
                );

                const toggle = document.getElementById("layer-toggle");

                if (candidates.length === 0) {
                    alert("CRITICAL ERROR: No layer with the word 'station' was found in the map style.\n\nPlease open the browser console (F12) to see the list of all available layers.");
                    toggle.disabled = true;
                    return;
                }

                // 2. We found matches! Let's pick the first one.
                // CHECK THIS ALERT ON YOUR SCREEN TO SEE THE REAL ID
                const realLayerId = candidates[0].id;
                alert(`FOUND IT! \n\nThe internal Layer ID is: "${realLayerId}"\n\nI am automatically using this ID now. Try clicking the checkbox.`);

                // --- ACTUAL TOGGLE LOGIC ---

                // Get the full layer object to check Zoom levels
                const layerObj = map.getLayer(realLayerId);

                // Check if the layer is hidden by Zoom
                if (layerObj.minzoom && map.getZoom() < layerObj.minzoom) {
                    alert(`WARNING: The layer exists, but it is hidden at this zoom level.\n\nCurrent Zoom: ${map.getZoom()}\nLayer appears at: ${layerObj.minzoom}\n\nZoom in to see the changes!`);
                }

                // Initialize: Force hidden
                map.setLayoutProperty(realLayerId, "visibility", "none");

                // Click Handler
                toggle.onclick = (e) => {
                    const visibility = e.target.checked ? "visible" : "none";
                    map.setLayoutProperty(realLayerId, "visibility", visibility);
                    console.log(`Toggled ${realLayerId} to ${visibility}`);
                };
            });
        </script>
    </body>
</html>
